<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analýza četnosti slov - Word Cloud</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Analýza četnosti slov</h1>
            <p class="subtitle">Vložte text a vytvořte krásný word cloud</p>
        </header>

        <div class="input-section">
            <textarea
                id="textInput"
                placeholder="Vložte váš text zde (až 10 000 slov)..."
                maxlength="70000"
            ></textarea>
            <div class="button-group">
                <button id="analyzeBtn" class="btn btn-primary">Analyzovat text</button>
                <button id="clearBtn" class="btn btn-secondary">Vymazat</button>
            </div>
            <div id="wordCount" class="word-count">Počet slov: 0</div>
        </div>

        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="stats">
                <h2>Statistiky</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Celkem slov:</span>
                        <span id="totalWords" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Unikátních slov:</span>
                        <span id="uniqueWords" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Nejčastější slovo:</span>
                        <span id="mostCommon" class="stat-value">-</span>
                    </div>
                </div>
            </div>

            <div class="wordcloud-section">
                <h2>Word Cloud</h2>
                <canvas id="wordcloud" width="800" height="600"></canvas>
            </div>

            <div class="frequency-table">
                <h2>Top 20 nejčastějších slov</h2>
                <table id="frequencyTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Slovo</th>
                            <th>Počet výskytů</th>
                            <th>Frekvence</th>
                        </tr>
                    </thead>
                    <tbody id="frequencyTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>Vytvořeno s ❤️ pro analýzu textů |
           <a href="emotion-analysis.html" style="color: #90cdf4; text-decoration: none; font-weight: 600;">Zkusit analýzu emocí z tváře →</a>
        </p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
